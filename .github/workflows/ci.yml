name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - '**.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Short Commit Hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            pandeyanurag2010/voting-app:${{ steps.vars.outputs.sha_short }}
            pandeyanurag2010/voting-app:latest

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pandeyanurag2010/voting-app:${{ steps.vars.outputs.sha_short }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  update-helm-tag:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Short Commit Hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update Image Tag in Helm values.yaml
        run: |
          sed -i "s|image: pandeyanurag2010/voting-app:.*|image: pandeyanurag2010/voting-app:${{ steps.vars.outputs.sha_short }}|" helm/voting-app/values.yaml

      - name: Commit and Push Updated Helm Values
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/voting-app/values.yaml
          git commit -m "chore(ci): update voting-app image tag to ${{ steps.vars.outputs.sha_short }}"
          git pull --rebase origin main
          git push origin main
